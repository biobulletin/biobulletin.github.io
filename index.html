<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Curious Atom — a student STEM magazine</title>
  <meta name="description" content="Student-written STEM articles, Wordle, crosswords and more.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>

  <!-- ===== Top navigation ===== -->
  <header class="topbar">
    <nav class="nav" aria-label="Main">
      <a href="#/" class="brand">
        <img src="assets/logo.svg" alt="" width="34" height="34">
        <span>The Curious Atom</span>
      </a>

      <div class="nav-links">
        <a href="#/" data-nav="/"><span class="ni" aria-hidden="true">🏠</span><span>Home</span></a>
        <a href="#/articles" data-nav="/article"><span class="ni" aria-hidden="true">📰</span><span>Articles</span></a>
        <a href="#/play" data-nav="/play"><span class="ni" aria-hidden="true">🧩</span><span>Play</span></a>
        <a href="#/me" data-nav="/me"><span class="ni" aria-hidden="true">🤖</span><span>My Space</span></a>
      </div>

      <div class="nav-right">
        <a href="#/me" class="coin-pill" title="Your coins" data-sound="pop">
          <span aria-hidden="true">🪙</span> <b id="coinCount">0</b>
        </a>
        <button id="muteBtn" class="icon-btn" data-sound="none" aria-label="Turn sound off">🔊</button>
      </div>
    </nav>
  </header>

  <!-- ===== Pages are drawn in here by the router ===== -->
  <main id="app" tabindex="-1"></main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <a href="#/" class="brand">
          <img src="assets/logo.svg" alt="" width="34" height="34">
          <span>The Curious Atom</span>
        </a>
        <p>A STEM magazine written by students, for students. Read, play, and level up.</p>
      </div>
      <nav class="footer-links" aria-label="Footer">
        <a href="#/articles">Articles</a>
        <a href="#/play">Play</a>
        <a href="#/me">My Space</a>
      </nav>
    </div>
    <div class="container footer-bottom">
      © <span id="year"></span> The Curious Atom club · Made by students
    </div>
  </footer>

  <!-- Pop-up messages appear in here -->
  <div id="toasts" aria-live="polite"></div>

  <!-- Scripts: order matters — each file can use the ones loaded before it -->
  <script src="js/router.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
