<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioBulletin — a student STEM reading club</title>
  <meta name="description" content="A student STEM reading club: articles we pick, read and discuss, plus Wordle, crosswords and more.">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- Colours the browser bar on phones to match the site -->
  <meta name="theme-color" content="#FAE9AC">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/articles.css">
  <link rel="stylesheet" href="css/play.css">
  <link rel="stylesheet" href="css/me.css">
</head>
<body>

  <!-- ===== Top navigation ===== -->
  <header class="topbar">
    <nav class="nav" aria-label="Main">
      <a href="#/" class="brand">
        <img src="assets/logo.png" alt="" width="46" height="46">
        <span>BioBulletin</span>
      </a>

      <div class="nav-links">
        <a href="#/" data-nav="/"><span class="ni" aria-hidden="true">🏠</span><span>Home</span></a>
        <a href="#/articles" data-nav="/article"><span class="ni" aria-hidden="true">📰</span><span>Articles</span></a>
        <a href="#/play" data-nav="/play"><span class="ni" aria-hidden="true">🧩</span><span>Play</span></a>
        <a href="#/me" data-nav="/me"><span class="ni" aria-hidden="true">🐾</span><span>My Space</span></a>
      </div>

      <div class="nav-right">
        <a href="#/me" class="nav-avatar" id="navAvatar" aria-label="My Space" data-sound="pop"></a>
        <a href="#/me" class="coin-pill" title="Your coins" data-sound="pop">
          <span aria-hidden="true">🪙</span> <b id="coinCount">0</b>
        </a>
        <button id="muteBtn" class="icon-btn" data-sound="none" aria-label="Turn sound off">🔊</button>
      </div>
    </nav>
  </header>

  <!-- ===== Pages are drawn in here by the router ===== -->
  <main id="app" tabindex="-1">
    <noscript>
      <p style="padding:48px 20px;text-align:center">BioBulletin needs JavaScript to run. Please turn it on in your browser settings.</p>
    </noscript>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <a href="#/" class="brand">
          <!-- The logo is dark maroon, so on the dark footer it sits on a light badge -->
          <span class="logo-badge"><img src="assets/logo.png" alt="" width="64" height="64"></span>
          <span>BioBulletin</span>
        </a>
        <p>A student STEM reading club. We pick great articles, read them and talk them through. Read, play, and level up.</p>
      </div>
      <nav class="footer-links" aria-label="Footer">
        <a href="#/articles">Articles</a>
        <a href="#/play">Play</a>
        <a href="#/me">My Space</a>
      </nav>
    </div>
    <div class="container footer-bottom">
      © <span id="year"></span> BioBulletin club · Run by students
    </div>
  </footer>

  <!-- Pop-up messages appear in here -->
  <div id="toasts" aria-live="polite"></div>

  <!-- One entry point. app.js imports everything else it needs.
       type="module" keeps all our code out of the browser console. -->
  <script type="module" src="js/app.js"></script>

  <!-- If someone double-clicks index.html, modules can't load (browser security).
       Explain instead of showing a blank page. -->
  <script>
    if (location.protocol === "file:") {
      document.getElementById("app").innerHTML =
        '<p style="padding:48px 20px;text-align:center;max-width:560px;margin:auto">' +
        '⚠️ This page can\'t run when opened as a file. In VS Code, right-click ' +
        '<b>index.html</b> → <b>Open with Live Server</b>.</p>';
    }
  </script>
</body>
</html>
